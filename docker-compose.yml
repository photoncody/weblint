services:
  weblint:
    image: ghcr.io/photoncody/weblint:latest
    # build: .
    container_name: weblint
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Generate a secure key with: openssl rand -hex 32
      # App will refuse to start if SECRET_KEY is unset/CHANGE_ME/weblint_secret.
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME}
      # Auth is OFF unless BOTH are set. Enable for any network-exposed deploy:
      # - WEBLINT_USERNAME=admin
      # - WEBLINT_PASSWORD=password
      # Optional: set WEBLINT_COOKIE_SECURE=1 behind HTTPS reverse proxies.
    volumes:
      - weblint_data:/data 
      # OR use bind mount below if you prefer local folder access:
      # - ./data:/data

volumes:
  weblint_data: